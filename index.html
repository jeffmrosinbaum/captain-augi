<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Captain Augi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--paper:#fffdf3;--yellow:#ffd60a;--red:#ef233c;--blue:#2b6cff;--green:#22c55e;--purple:#7b2cbf;--sky:#4cc9f0;
  --title:'Bangers',Impact,'Arial Black',sans-serif;--body:'Comic Neue','Comic Sans MS','Chalkboard SE',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#5a4fd0}
html,body{margin:0;height:100%}
body{font-family:var(--body);font-weight:700;color:var(--ink);overflow-x:hidden;
  background:radial-gradient(rgba(0,0,0,.14) 1.6px,transparent 1.8px) 0 0/14px 14px,linear-gradient(135deg,var(--sky),var(--purple))}
button{font:inherit;color:inherit;cursor:pointer;border:5px solid var(--ink);touch-action:manipulation}
button:focus-visible{outline:6px dashed #ff5fa2;outline-offset:3px}
#app{max-width:900px;margin:0 auto;min-height:100%;min-height:100dvh;padding:12px;display:flex;flex-direction:column;gap:14px}

/* the big comic panel */
.panel{position:relative;flex:1 1 auto;min-height:0;background:var(--paper);border:6px solid var(--ink);border-radius:8px;box-shadow:8px 8px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;overflow:hidden;
  background-image:radial-gradient(rgba(0,0,0,.13) 2px,transparent 2.3px);background-size:13px 13px}
.words{font-family:var(--title);letter-spacing:1.5px;text-align:center;font-size:clamp(2rem,7vw,3.4rem);line-height:1.05;margin:0}
.bubble{background:#fff;border:5px solid var(--ink);border-radius:30px;padding:10px 22px;position:relative;margin-bottom:18px}
.bubble::after{content:'';position:absolute;left:50%;bottom:-24px;border-style:solid;border-width:24px 12px 0 12px;border-color:var(--ink) transparent transparent;transform:translateX(-50%)}
.stage{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,4vw,40px)}
.hero{width:clamp(120px,30vw,220px);height:auto;display:block}
.big-emoji{font-size:clamp(4.5rem,17vw,8.5rem);line-height:1}
.reading{animation:pulse .8s ease-in-out infinite alternate}

/* round icon buttons */
.round{width:clamp(70px,16vw,92px);height:clamp(70px,16vw,92px);border-radius:50%;font-size:clamp(2.2rem,7vw,3rem);
  display:grid;place-items:center;box-shadow:5px 5px 0 var(--ink);background:#fff;padding:0;transition:transform .08s}
.round:active,.choice:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.speak{position:absolute;top:10px;right:10px;z-index:2}
.huge{width:clamp(150px,40vw,220px);height:clamp(150px,40vw,220px);font-size:clamp(4rem,14vw,6.5rem);box-shadow:8px 8px 0 var(--ink)}
.go{background:var(--green);color:#fff}
.back{background:var(--blue);color:#fff}
.play{background:var(--red);color:#fff;animation:bob 1.6s ease-in-out infinite}
.breathe-btn{background:var(--sky);align-self:center}

/* the two choices */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:0 0 auto}
.choice{position:relative;min-height:clamp(170px,30vh,260px);border-radius:20px;box-shadow:7px 7px 0 var(--ink);background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 8px;transition:transform .08s}
.choice:nth-child(1){background:#fff3b0}
.choice:nth-child(2){background:#d9f2ff}
.choice .ic{font-size:clamp(4rem,15vw,6.5rem);line-height:1}
.choice .lb{font-family:var(--title);letter-spacing:1px;font-size:clamp(1.6rem,5.5vw,2.4rem);line-height:1}
.choice .mini{position:absolute;top:8px;right:8px;width:52px;height:52px;border-radius:50%;border:4px solid var(--ink);background:#fff;
  display:grid;place-items:center;font-size:1.6rem}

/* result */
.burst{position:absolute;top:6%;left:50%;transform:translateX(-50%) rotate(-6deg);font-family:var(--title);color:#fff;letter-spacing:2px;
  font-size:clamp(2.6rem,10vw,4.4rem);padding:44px 70px;background:#ff8c1a;
  text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);
  clip-path:polygon(50% 0,61% 22%,85% 8%,78% 33%,100% 38%,80% 54%,96% 76%,70% 72%,64% 100%,50% 80%,35% 100%,30% 72%,4% 78%,20% 54%,0 38%,22% 32%,14% 8%,39% 22%);
  animation:pop .6s cubic-bezier(.4,1.8,.5,1) both}
.good-bg{background-color:#fff3b0}
.oops-bg{background-color:#e3ecff}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti span{position:absolute;top:-10%;font-size:2rem;animation:fall 2.4s linear forwards}
.row{display:flex;justify-content:center;align-items:center;gap:18px;flex:0 0 auto;padding:4px 0 10px}

/* title + end */
.logo{font-family:var(--title);text-align:center;font-size:clamp(3.4rem,14vw,7rem);line-height:.9;color:var(--yellow);margin:0;transform:rotate(-3deg);
  text-shadow:4px 4px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),8px 8px 0 var(--red)}
.star{position:relative;width:clamp(240px,62vw,400px);aspect-ratio:1;display:grid;place-items:center;animation:spinin .9s cubic-bezier(.4,1.6,.5,1) both}
.star svg{position:absolute;inset:0;width:100%;height:100%}
.star .words{position:relative;color:#fff;text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);font-size:clamp(1.9rem,7vw,3.2rem);margin-top:12%}

/* breathing overlay */
#breath{position:fixed;inset:0;z-index:50;display:none;place-items:center;
  background:radial-gradient(rgba(255,255,255,.18) 2px,transparent 2.3px) 0 0/14px 14px,rgba(20,10,60,.9)}
#breath.on{display:grid}
.bcircle{width:min(70vw,60vh,360px);aspect-ratio:1;border-radius:50%;border:8px solid var(--ink);
  background:radial-gradient(circle,#d8f8ff,var(--sky) 60%,var(--blue));box-shadow:0 0 0 8px #fff,0 0 70px var(--sky);
  display:grid;place-items:center;font-family:var(--title);font-size:clamp(4rem,16vw,7rem);color:#fff;text-shadow:3px 3px 0 var(--ink);
  transform:scale(.45);transition:transform 4s ease-in-out}
.bcircle.big{transform:scale(1)}
.bclose{position:fixed;top:16px;right:16px}

@keyframes pop{0%{transform:translateX(-50%) scale(0) rotate(-25deg)}100%{transform:translateX(-50%) scale(1) rotate(-6deg)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.05)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes spinin{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.mad .hero{animation:shake .25s linear 6}
@media (max-width:520px){#app{padding:8px;gap:10px}.panel{padding:12px;box-shadow:5px 5px 0 var(--ink)}.choices{gap:10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="breath" role="dialog" aria-label="Breathe"></div>

<script>
/* =====================================================================
   GAME CONTENT  -  EDIT EVERYTHING HERE
   ---------------------------------------------------------------------
   - "text"  = the few words shown on screen (keep it to ~6 words).
   - "say"   = what the voice reads out loud (can be a bit longer).
   - "audio" = OPTIONAL link to a recorded voice file (mp3/m4a), e.g.
               "audio/mission1.mp3". Leave "" to use the computer voice.
               If a file is missing or fails, the computer voice is used.
   - Each mission has exactly 2 choices. Mark the hero choice good:true.
     Mix up which side the good choice is on so Augi has to think.
   - "icon" = an emoji shown big on the picture button.
   SAFETY: no hurting anyone, nothing scary, nothing shaming.
   ===================================================================== */
const GAME = {
  hero: { name: "Captain Augi", skin: "#f2c29b", hair: "#5a3b22", suit: "#2b6cff", cape: "#ef233c", mask: "#7b2cbf" },
  voice: { rate: 0.85, pitch: 1.1 },   // slower = easier to follow

  title: { text: "Captain Augi!", say: "Captain Augi! Let's go, hero!", audio: "" },

  missions: [
    { // 1. Recess vs. doing work
      scene: ["🏫", "👩‍🏫"],
      text: "Work first. Then recess!",
      say: "Your teacher says: Do your work first. Then it's recess!",
      audio: "",
      choices: [
        { icon: "📚", label: "Do my work", say: "Do my work.", audio: "", good: true,
          result: { icon: "⚽", text: "Recess time! Yay!", say: "You did your work. Now you get to play at recess!", audio: "" } },
        { icon: "🙅", label: "Say NO!", say: "Say no!", audio: "", good: false,
          result: { icon: "⏰", text: "Oh no. No recess.", say: "Oh no. Recess is over, and the work is still there. Let's try again.", audio: "" } }
      ]
    },
    { // 2. Teacher says "start now"
      scene: ["📖", "👨‍🏫"],
      text: "Start your work now.",
      say: "Your teacher says: Time to start your work now.",
      audio: "",
      choices: [
        { icon: "🙈", label: "Push it away", say: "Push it away.", audio: "", good: false,
          result: { icon: "📄", text: "The work is still waiting.", say: "Hmm. The work is still waiting for you. Let's try again.", audio: "" } },
        { icon: "💪", label: "Start now", say: "Start now.", audio: "", good: true,
          result: { icon: "🌟", text: "You started! Great job!", say: "You started! The hardest part is done. Great job!", audio: "" } }
      ]
    },
    { // 3. Screen time is over
      scene: ["🎮", "🧑"],
      text: "Tablet off now, please.",
      say: "Screen time is over. Tablet off now, please.",
      audio: "",
      choices: [
        { icon: "📴", label: "Turn it off", say: "Turn it off.", audio: "", good: true,
          result: { icon: "🍪", text: "Snack time! So proud!", say: "You turned it off all by yourself. Snack time! Everyone is so proud.", audio: "" } },
        { icon: "🎮", label: "Keep playing", say: "Keep playing.", audio: "", good: false,
          result: { icon: "📵", text: "No tablet tomorrow.", say: "Uh oh. Now the tablet has to rest tomorrow too. Let's try again.", audio: "" } }
      ]
    },
    { // 4. A hard problem: ask for help
      scene: ["🧩", "😣"],
      text: "This is SO hard!",
      say: "This problem is so hard!",
      audio: "",
      choices: [
        { icon: "🗑️", label: "Crumple it", say: "Crumple it up.", audio: "", good: false,
          result: { icon: "📄", text: "Now start over.", say: "Oh no. Now you have to start all over. Let's try again.", audio: "" } },
        { icon: "🙋", label: "Ask for help", say: "Ask for help.", audio: "", good: true,
          result: { icon: "💡", text: "You figured it out!", say: "Your teacher helped, and you figured it out! Asking for help is a hero move.", audio: "" } }
      ]
    }
  ],

  choicesIntro: { say: "Will you", audio: "" },   // read before the choices: "Will you ... Do my work? Or ... Say no?"
  or:           { say: "or", audio: "" },
  breathe: {
    start: { say: "Let's take three hero breaths.", audio: "" },
    in:    { say: "Breathe in...", audio: "" },
    out:   { say: "and out.", audio: "" },
    done:  { say: "Great breathing! Now choose.", audio: "" }
  },
  goodBurst: "YAY!",
  end: { text: "You're a hero!", say: "You did it! You're a hero, Captain Augi!", audio: "" }
};

/* =====================================================================
   GAME ENGINE (no need to edit below)
   ===================================================================== */
const H = GAME.hero, app = document.getElementById('app'), breathEl = document.getElementById('breath');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let mission = 0, calm = false, lastLines = [];

/* ---------- Voice: plays recorded audio if given, else speechSynthesis ---------- */
let voiceToken = 0, currentAudio = null, chosenVoice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const v = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  chosenVoice = v.find(x => /samantha|google us english|aria|jenny|zira/i.test(x.name)) || v[0] || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function stopVoice() {
  voiceToken++;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.reading').forEach(e => e.classList.remove('reading'));
}
function sayOne(line, token) {   // returns a Promise that resolves when the line is finished
  return new Promise(resolve => {
    if (token !== voiceToken) return resolve();
    const tts = () => {
      if (!('speechSynthesis' in window) || !line.say) return setTimeout(resolve, 300);
      const u = new SpeechSynthesisUtterance(line.say);
      u.rate = GAME.voice.rate; u.pitch = GAME.voice.pitch; u.lang = 'en-US';
      if (chosenVoice) u.voice = chosenVoice;
      let done = false; const fin = () => { if (!done) { done = true; resolve(); } };
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 1500 + line.say.length * 110);   // safety net if a browser never fires onend
      speechSynthesis.speak(u);
    };
    if (line.audio) {
      const a = new Audio(line.audio); currentAudio = a;
      a.onended = resolve; a.onerror = tts;
      a.play().catch(tts);
    } else tts();
  });
}
async function speak(lines) {    // lines: [{say, audio, el}] spoken in order; el gets a pulse while read
  stopVoice(); lastLines = lines;
  const token = voiceToken;
  for (const line of lines) {
    if (token !== voiceToken) return;
    const el = line.el ? document.querySelector(line.el) : null;
    if (el) el.classList.add('reading');
    await sayOne(line, token);
    if (el) el.classList.remove('reading');
  }
}
const replay = () => speak(lastLines);

/* ---------- Hero picture (inline SVG). mood: mad | calm | happy | oops ---------- */
function heroSVG(mood) {
  const brows = { mad: '<path d="M70 58 L92 66"/><path d="M130 58 L108 66"/>', calm: '<path d="M72 60 L92 60"/><path d="M108 60 L128 60"/>',
    happy: '<path d="M72 58 Q82 50 92 58"/><path d="M108 58 Q118 50 128 58"/>', oops: '<path d="M72 62 L92 57"/><path d="M108 57 L128 62"/>' }[mood];
  const mouth = { mad: '<path d="M84 98 Q100 88 116 98" fill="none"/>', calm: '<path d="M86 94 Q100 104 114 94" fill="none"/>',
    happy: '<path d="M82 90 Q100 116 118 90 Z" fill="#fff"/>', oops: '<path d="M86 100 Q100 92 114 100" fill="none"/>' }[mood];
  const arms = { mad: '<path d="M66 122 L50 168" fill="none"/><path d="M134 122 L150 168" fill="none"/>',
    calm: '<path d="M66 122 L44 156 L64 172" fill="none"/><path d="M134 122 L156 156 L136 172" fill="none"/>',
    happy: `<path d="M66 122 L36 70" fill="none"/><circle cx="34" cy="64" r="11" fill="${H.skin}"/><path d="M134 122 L164 70" fill="none"/><circle cx="166" cy="64" r="11" fill="${H.skin}"/>`,
    oops: '<path d="M66 122 L52 170" fill="none"/><path d="M134 122 L148 170" fill="none"/>' }[mood];
  const steam = mood === 'mad' ? '<g fill="#fff" stroke-width="3"><circle cx="58" cy="22" r="9"/><circle cx="46" cy="10" r="6"/><circle cx="142" cy="22" r="9"/><circle cx="154" cy="10" r="6"/></g>' : '';
  const tear = mood === 'oops' ? '<path d="M126 80 Q130 90 126 94 Q122 90 126 80 Z" fill="#7fd3ff" stroke-width="2"/>' : '';
  const cheek = mood === 'mad' ? '#ef233c' : '#ff8fab';
  return `<svg class="hero" viewBox="0 0 200 250" role="img" aria-label="${esc(H.name)}" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#111" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M66 116 L26 238 L174 238 L134 116 Z" fill="${H.cape}"/>
    <rect x="76" y="196" width="20" height="40" rx="6" fill="${H.suit}"/><rect x="104" y="196" width="20" height="40" rx="6" fill="${H.suit}"/>
    <path d="M72 226 h28 v14 h-32 z" fill="${H.cape}"/><path d="M100 226 h28 l4 14 h-32 z" fill="${H.cape}"/>
    ${arms}
    <rect x="64" y="112" width="72" height="92" rx="22" fill="${H.suit}"/>
    <rect x="64" y="182" width="72" height="12" fill="#ffd60a"/>
    <path d="M100 128 L122 136 Q122 162 100 174 Q78 162 78 136 Z" fill="#ffd60a"/>
    <rect x="91" y="140" width="6" height="20" rx="2" fill="#111" stroke="none"/><rect x="103" y="140" width="6" height="20" rx="2" fill="#111" stroke="none"/>
    <circle cx="100" cy="72" r="44" fill="${H.skin}"/>
    <path d="M56 66 Q54 26 100 24 Q146 26 144 66 Q132 44 112 46 Q118 36 104 34 Q96 46 70 48 Q60 54 56 66 Z" fill="${H.hair}"/>
    <path d="M62 64 Q100 52 138 64 Q140 80 122 82 Q108 82 100 74 Q92 82 78 82 Q60 80 62 64 Z" fill="${H.mask}"/>
    <ellipse cx="82" cy="69" rx="9" ry="7" fill="#fff" stroke-width="3"/><ellipse cx="118" cy="69" rx="9" ry="7" fill="#fff" stroke-width="3"/>
    <circle cx="83" cy="70" r="3.5" fill="#111" stroke="none"/><circle cx="119" cy="70" r="3.5" fill="#111" stroke="none"/>
    <g fill="none">${brows}</g>
    <g fill="${cheek}" opacity=".45" stroke="none"><circle cx="72" cy="88" r="8"/><circle cx="128" cy="88" r="8"/></g>
    <g stroke-width="4">${mouth}</g>${steam}${tear}
  </g></svg>`;
}
const speakerBtn = () => `<button class="round speak" onclick="replay()" aria-label="Hear it again">🔊</button>`;
function show(html) { app.innerHTML = html; window.scrollTo(0, 0); }

/* ---------- Screens ---------- */
function titleScreen() {
  stopVoice();
  show(`<section class="panel" style="background-color:#fff3b0">
      <h1 class="logo">${esc(GAME.title.text)}</h1>
      ${heroSVG('happy')}
      <button class="round huge play" onclick="start()" aria-label="Play">▶</button>
    </section>`);
}
function start() {
  // This tap "unlocks" the voice on phones and tablets.
  if ('speechSynthesis' in window) { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance('')); }
  mission = 0; missionScreen(true);
}

function missionScreen(withTitle, quiet) {
  const m = GAME.missions[mission];
  show(`<section class="panel ${calm ? '' : 'mad'}" style="background-color:#ffe3ec">
      ${speakerBtn()}
      <div class="bubble"><p class="words" id="scene-words">${esc(m.text)}</p></div>
      <div class="stage">${heroSVG(calm ? 'calm' : 'mad')}<span class="big-emoji">${m.scene.join(' ')}</span></div>
    </section>
    <button class="round breathe-btn" onclick="breathe()" aria-label="Breathe">🌬️</button>
    <div class="choices">
      ${m.choices.map((c, k) => `
        <button class="choice" id="choice${k}" data-good="${c.good}" onclick="choose(${k})" aria-label="${esc(c.label)}">
          <span class="mini" role="button" aria-label="Hear this choice" onclick="event.stopPropagation(); speak([{say:GAME.missions[mission].choices[${k}].say, audio:GAME.missions[mission].choices[${k}].audio, el:'#choice${k}'}])">🔊</span>
          <span class="ic">${c.icon}</span><span class="lb">${esc(c.label)}</span>
        </button>`).join('')}
    </div>`);
  const lines = [];
  if (withTitle) lines.push(GAME.title);
  lines.push({ ...m, el: '#scene-words' });
  lines.push(...choiceLines(m));
  if (!quiet) speak(lines);
}
function choiceLines(m) {
  return [GAME.choicesIntro,
    { ...m.choices[0], el: '#choice0' }, GAME.or, { ...m.choices[1], el: '#choice1' }];
}

function choose(k) {
  const c = GAME.missions[mission].choices[k], r = c.result;
  const confetti = c.good ? `<div class="confetti">${Array.from({ length: 18 }, (_, i) =>
      `<span style="left:${(i * 37) % 100}%;animation-delay:${(i % 6) * 0.15}s">${['⭐', '🎉', '✨'][i % 3]}</span>`).join('')}</div>` : '';
  show(`<section class="panel ${c.good ? 'good-bg' : 'oops-bg'}">
      ${confetti}${c.good ? `<div class="burst">${esc(GAME.goodBurst)}</div>` : ''}
      ${speakerBtn()}
      <div class="stage" style="margin-top:${c.good ? '18%' : '0'}">${heroSVG(c.good ? 'happy' : 'oops')}<span class="big-emoji">${r.icon}</span></div>
      <p class="words" id="result-words">${esc(r.text)}</p>
    </section>
    <div class="row">
      ${c.good
        ? `<button class="round huge go" onclick="next()" aria-label="Next">➜</button>`
        : `<button class="round huge back" onclick="tryAgain()" aria-label="Try again">⟲</button>`}
    </div>`);
  speak([{ ...r, el: '#result-words' }]);
}
function next() { calm = false; mission++; mission < GAME.missions.length ? missionScreen() : endScreen(); }
function tryAgain() { calm = false; missionScreen(); }

function endScreen() {
  show(`<section class="panel" style="background-color:#fff3b0">
      <div class="confetti">${Array.from({ length: 24 }, (_, i) =>
        `<span style="left:${(i * 29) % 100}%;animation-delay:${(i % 8) * 0.2}s">${['⭐', '🎉', '✨'][i % 3]}</span>`).join('')}</div>
      ${speakerBtn()}
      <div class="star">
        <svg viewBox="0 0 100 100"><polygon points="50,3 62,36 97,37 69,58 79,92 50,72 21,92 31,58 3,37 38,36" fill="#ffd60a" stroke="#111" stroke-width="3.5" stroke-linejoin="round"/></svg>
        <p class="words" id="end-words">${esc(GAME.end.text)}</p>
      </div>
      ${heroSVG('happy')}
    </section>
    <div class="row"><button class="round huge play" style="background:var(--green);animation:none" onclick="mission=0;calm=false;missionScreen()" aria-label="Play again">↻</button></div>`);
  speak([{ ...GAME.end, el: '#end-words' }]);
}

/* ---------- Breathe: 3 guided breaths ---------- */
let breathTimers = [];
function breathe() {
  stopVoice();
  breathEl.innerHTML = `<button class="round bclose" onclick="endBreathe(false)" aria-label="Close">✖</button><div class="bcircle" id="bc">🌬️</div>`;
  breathEl.classList.add('on');
  const bc = document.getElementById('bc'), B = GAME.breathe, tok = voiceToken;
  const at = (ms, fn) => breathTimers.push(setTimeout(fn, ms));
  sayOne(B.start, tok);
  for (let i = 0; i < 3; i++) {
    const t0 = 2200 + i * 8000;
    at(t0, () => { bc.classList.add('big'); bc.textContent = i + 1; sayOne(B.in, voiceToken); });
    at(t0 + 4000, () => { bc.classList.remove('big'); sayOne(B.out, voiceToken); });
  }
  at(2200 + 3 * 8000, () => endBreathe(true));
}
function endBreathe(finished) {
  breathTimers.forEach(clearTimeout); breathTimers = [];
  breathEl.classList.remove('on'); breathEl.innerHTML = '';
  calm = true;
  // Back to the same mission, now with a calm face; read the choices again.
  const m = GAME.missions[mission];
  missionScreen(false, true);
  speak([...(finished ? [GAME.breathe.done] : []), ...choiceLines(m)]);
}

titleScreen();
