<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captain Augi and the Pause Power!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111; --paper:#fffdf3; --yellow:#ffd60a; --red:#ef233c; --blue:#2b6cff;
  --green:#22c55e; --purple:#7b2cbf; --orange:#ff8c1a; --sky:#4cc9f0; --pink:#ff5fa2;
  --title:'Bangers', Impact, 'Arial Black', sans-serif;
  --body:'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Trebuchet MS', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:#5a4fd0}
body{
  font-family:var(--body); color:var(--ink); min-height:100vh;
  background:
    radial-gradient(rgba(0,0,0,.16) 1.6px, transparent 1.8px) 0 0/14px 14px,
    linear-gradient(135deg, var(--sky), var(--purple));
}
button{font:inherit;color:inherit}
.page{max-width:920px;margin:0 auto;padding:14px;display:grid;gap:16px}
.panel{
  background:var(--paper); border:5px solid var(--ink); border-radius:6px;
  box-shadow:7px 7px 0 var(--ink); padding:18px; position:relative; overflow:hidden;
}
.halftone{background-image:radial-gradient(rgba(0,0,0,.15) 2px, transparent 2.3px);background-size:12px 12px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
h1,h2,h3,.comic{font-family:var(--title);letter-spacing:1.5px;font-weight:400;margin:0}
h2{font-size:clamp(1.7rem,5vw,2.6rem)}
h3{font-size:clamp(1.4rem,4vw,1.9rem)}
p{font-size:clamp(1.15rem,3.2vw,1.45rem);line-height:1.45;margin:.4em 0}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--yellow);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:8px 14px;border-radius:6px}
.topbar .mission{font-family:var(--title);font-size:clamp(1.2rem,3.6vw,1.7rem);letter-spacing:1px}
.pts{font-family:var(--title);font-size:clamp(1.2rem,3.6vw,1.7rem);background:#fff;border:3px solid var(--ink);border-radius:30px;padding:2px 14px}
.progress{display:flex;gap:6px}
.progress span{width:18px;height:18px;border:3px solid var(--ink);border-radius:50%;background:#fff}
.progress span.done{background:var(--green)}
.progress span.now{background:var(--red)}

/* buttons */
.btn{
  font-family:var(--title);letter-spacing:1.5px;font-size:clamp(1.35rem,4vw,1.9rem);
  padding:14px 24px;border:4px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);
  background:var(--yellow);cursor:pointer;transition:transform .08s, box-shadow .08s;min-height:60px;
}
.btn:hover{transform:translate(-1px,-1px) rotate(-1deg)}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff;text-shadow:2px 2px 0 var(--ink)}
.btn.blue{background:var(--blue);color:#fff;text-shadow:2px 2px 0 var(--ink)}
.btn.green{background:var(--green);color:#fff;text-shadow:2px 2px 0 var(--ink)}
.btn.white{background:#fff}
.btn.small{font-size:1.15rem;padding:8px 14px;min-height:44px;box-shadow:3px 3px 0 var(--ink)}
.btn:focus-visible,.choice:focus-visible{outline:5px dashed var(--pink);outline-offset:3px}
.btn[disabled]{opacity:.55;cursor:default}

.say{position:absolute;top:10px;right:10px;z-index:3}

/* scene */
.scene{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:end;min-height:230px}
.scene .art{font-size:clamp(3.2rem,10vw,5.5rem);line-height:1}
.hero{width:clamp(130px,26vw,190px);height:auto;display:block}
.caption{display:inline-block;background:var(--yellow);border:3px solid var(--ink);padding:6px 12px;
  font-weight:700;font-size:clamp(1.05rem,3vw,1.3rem);box-shadow:3px 3px 0 var(--ink);margin-bottom:14px;max-width:100%}
.speaker{font-family:var(--title);font-size:1.3rem;letter-spacing:1px;margin:0 0 4px 8px}
.bubble{background:#fff;border:4px solid var(--ink);border-radius:28px;padding:14px 18px;position:relative;
  font-weight:700;font-size:clamp(1.2rem,3.4vw,1.5rem);margin-bottom:26px;line-height:1.35}
.bubble::before{content:'';position:absolute;bottom:-24px;left:36px;border-style:solid;border-width:24px 10px 0 18px;border-color:var(--ink) transparent transparent transparent}
.bubble::after{content:'';position:absolute;bottom:-16px;left:41px;border-style:solid;border-width:17px 6px 0 13px;border-color:#fff transparent transparent transparent}
.cast{display:flex;gap:10px;align-items:flex-end;font-size:clamp(2.6rem,8vw,4.2rem)}

/* feelings */
.thought{background:#fff;border:4px dashed var(--ink);border-radius:40px;padding:12px 18px;font-size:clamp(1.15rem,3.2vw,1.4rem);font-weight:700}
.meter{margin-top:12px}
.meter .bar{height:30px;border:4px solid var(--ink);border-radius:20px;position:relative;
  background:linear-gradient(90deg,var(--green),var(--yellow) 50%,var(--red));}
.meter .needle{position:absolute;top:-14px;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:20px solid var(--ink);transform:translateX(-13px);transition:left 1.2s cubic-bezier(.5,1.6,.5,1)}
.meter .labels{display:flex;justify-content:space-between;font-family:var(--title);font-size:1.1rem;letter-spacing:1px;margin-top:4px}

/* power ups */
.powers{background:linear-gradient(135deg,#d9f2ff,#efe0ff)}
.powers .row{justify-content:center}
.powers .btn{flex:1 1 240px}
.note{font-size:1.05rem;font-weight:700;margin-top:8px}

/* choices */
.choices{display:grid;gap:14px;margin-top:12px}
.choice{display:flex;gap:14px;align-items:center;width:100%;text-align:left;cursor:pointer;
  background:#fff;border:4px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);
  padding:14px 16px;font-weight:700;font-size:clamp(1.15rem,3.3vw,1.45rem);line-height:1.3;min-height:70px;transition:transform .08s}
.choice:hover{transform:translate(-2px,-2px);background:#fffbe0}
.choice:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.choice .letter{flex:0 0 auto;width:48px;height:48px;border-radius:50%;border:4px solid var(--ink);background:var(--yellow);
  font-family:var(--title);font-size:1.6rem;display:grid;place-items:center}
.choice .vision{display:none;margin-top:6px;font-size:.95em;color:#4a1d7a;background:#f2e6ff;border:2px dashed var(--purple);border-radius:10px;padding:6px 10px;font-weight:700}
.show-vision .choice .vision{display:block;animation:fadein .5s}

/* burst */
.burst{display:inline-grid;place-items:center;font-family:var(--title);color:#fff;letter-spacing:2px;
  font-size:clamp(2.4rem,9vw,4.4rem);padding:50px 90px;text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);
  clip-path:polygon(50% 0,61% 22%,85% 8%,78% 33%,100% 38%,80% 54%,96% 76%,70% 72%,64% 100%,50% 80%,35% 100%,30% 72%,4% 78%,20% 54%,0 38%,22% 32%,14% 8%,39% 22%);
  animation:pop .6s cubic-bezier(.4,1.8,.5,1) both;transform:rotate(-6deg)}
.burst.good{background:var(--orange)}
.burst.oops{background:var(--blue)}
.lesson{background:var(--yellow);border:4px solid var(--ink);border-radius:12px;padding:12px 16px;box-shadow:4px 4px 0 var(--ink);margin-top:12px}
.lesson b{font-family:var(--title);font-size:1.5rem;letter-spacing:1px;font-weight:400}
.earned{font-family:var(--title);font-size:clamp(1.3rem,4vw,1.8rem);letter-spacing:1px;margin-top:12px}
.badge-pop{display:inline-flex;align-items:center;gap:10px;background:#fff;border:4px solid var(--ink);border-radius:40px;padding:6px 16px 6px 8px;box-shadow:4px 4px 0 var(--ink);animation:pop .7s .3s cubic-bezier(.4,1.8,.5,1) both;margin-top:10px}
.badge-pop .ic{font-size:2rem;width:50px;height:50px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);display:grid;place-items:center}

/* title */
.logo{font-family:var(--title);text-align:center;line-height:.9;margin:8px 0}
.logo .a{display:block;font-size:clamp(3.2rem,13vw,6.5rem);color:var(--yellow);
  text-shadow:4px 4px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),8px 8px 0 var(--red);transform:rotate(-3deg)}
.logo .b{display:inline-block;margin-top:10px;font-size:clamp(1.5rem,5vw,2.4rem);background:var(--red);color:#fff;border:4px solid var(--ink);padding:4px 16px;box-shadow:4px 4px 0 var(--ink);transform:rotate(2deg);text-shadow:2px 2px 0 var(--ink)}
.title-hero{display:flex;justify-content:center;position:relative}
.title-hero .hero{width:clamp(170px,40vw,260px);animation:float 3s ease-in-out infinite}
.title-hero .burst{position:absolute;right:6%;top:6%;font-size:clamp(1.6rem,5vw,2.4rem);padding:30px 36px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0}
.step{border:4px solid var(--ink);border-radius:12px;padding:12px;background:#fff;box-shadow:4px 4px 0 var(--ink);text-align:center}
.step .ic{font-size:2.6rem}
.step h3{margin:4px 0}
.step p{font-size:1.1rem}

/* certificate */
.cert{background:#fffbea;border:10px double var(--ink);text-align:center;padding:24px}
.cert .name{font-family:var(--title);font-size:clamp(2.4rem,9vw,4rem);color:var(--red);text-shadow:3px 3px 0 var(--ink);letter-spacing:2px}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:14px 0}
.bdg{border:4px solid var(--ink);border-radius:14px;padding:10px;background:#fff;box-shadow:3px 3px 0 var(--ink)}
.bdg .ic{font-size:2.4rem}
.bdg .nm{font-family:var(--title);font-size:1.15rem;letter-spacing:1px}
.bdg.locked{opacity:.35;filter:grayscale(1)}

/* overlay (breathing / rewind / toast) */
#overlay{position:fixed;inset:0;display:none;place-items:center;z-index:50;
  background:radial-gradient(rgba(255,255,255,.2) 2px, transparent 2.3px) 0 0/14px 14px, rgba(20,10,60,.88)}
#overlay.on{display:grid}
.breath-box{text-align:center;color:#fff;padding:20px}
.breath-circle{width:min(62vw,300px);height:min(62vw,300px);border-radius:50%;margin:20px auto;border:8px solid var(--ink);
  background:radial-gradient(circle,#bdf3ff,var(--sky) 60%,var(--blue));box-shadow:0 0 0 8px #fff, 0 0 60px var(--sky);
  display:grid;place-items:center;font-family:var(--title);font-size:clamp(1.6rem,6vw,2.4rem);color:var(--ink);transform:scale(.55);transition:transform 3s ease-in-out}
.breath-circle.big{transform:scale(1)}
.breath-msg{font-family:var(--title);font-size:clamp(2rem,7vw,3rem);letter-spacing:2px;text-shadow:3px 3px 0 var(--ink)}
.breath-count{font-family:var(--title);font-size:1.6rem;letter-spacing:1px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--yellow);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);
  border-radius:40px;padding:10px 22px;font-family:var(--title);font-size:1.5rem;letter-spacing:1px;animation:toastpop .5s cubic-bezier(.4,1.8,.5,1) both}
.rewind{font-family:var(--title);font-size:clamp(3rem,12vw,6rem);color:var(--yellow);text-shadow:4px 4px 0 var(--ink);animation:spin .9s ease-in-out both}

@keyframes pop{0%{transform:scale(0) rotate(-25deg)}100%{transform:scale(1) rotate(-6deg)}}
@keyframes toastpop{0%{transform:translateX(-50%) scale(0)}100%{transform:translateX(-50%) scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes fadein{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
@keyframes spin{0%{transform:scale(.3) rotate(360deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.mad .hero{animation:shake .25s linear 6}

@media (max-width:560px){
  .scene{grid-template-columns:1fr;justify-items:center}
  .scene .hero{width:140px}
  .say{position:static;display:block;margin:0 0 10px auto}
  .page{padding:10px;gap:14px}
  .panel{padding:14px;box-shadow:5px 5px 0 var(--ink)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff}
  .noprint,.topbar,.say{display:none!important}
  .panel{box-shadow:none}
}
</style>
</head>
<body>
<main id="app" class="page" aria-live="polite"></main>
<div id="overlay" role="dialog" aria-modal="true"></div>

<script>
/* =====================================================================
   STORY DATA  —  EDIT EVERYTHING ABOUT THE GAME HERE
   ---------------------------------------------------------------------
   HOW IT WORKS
   - STORY.hero: the hero's name and colors (change skin/hair/suit colors!).
   - STORY.scenarios: one entry per "mission". They play in order.
   - Each scenario has "nodes" (comic pages). The game starts at "start".
     A node has:
        caption  : yellow narrator box (short!)
        speaker  : who is talking (optional)
        bubble   : what they say (optional)
        cast     : emoji for the other characters in the panel
        feeling  : how the hero feels (shows the Feeling Meter) (optional)
        heat     : 0-10, how "red" he feels (10 = seeing red)
        choices  : 2-3 choices. Each choice has:
             text   : what the button says
             vision : what "Think-Ahead Vision" shows might happen
             AND EITHER
             go     : the id of another node (to branch the story), OR
             result : { good:true/false, sfx, art, text, lesson }
   - good:true  -> celebrate, award points + the scenario's badge.
     good:false -> gentle natural consequence, then "Rewind Time" to retry.
   KEEP IT KIND: no hurting anyone, nothing scary or shaming.
   ===================================================================== */
const STORY = {
  hero: {
    name: "Captain Augi",
    shortName: "Augi",
    skin: "#f2c29b",   // change to match Augi
    hair: "#5a3b22",
    suit: "#2b6cff",
    cape: "#ef233c",
    mask: "#7b2cbf"
  },

  // Points
  points: { good: 10, firstTryBonus: 5, breath: 2, vision: 2 },

  // Extra badges for using powers (scenario badges live in each scenario)
  powerBadges: {
    breath:   { icon: "🌬️", name: "Breath Master",   desc: "Used Hero Breaths 3 times" },
    vision:   { icon: "🔮", name: "Future Vision",   desc: "Used Think-Ahead Vision 3 times" },
    comeback: { icon: "⏪", name: "Comeback Hero",   desc: "Rewound time and made a great choice" }
  },

  scenarios: [
    /* ---------------- MISSION 1: Recess vs. schoolwork ---------------- */
    {
      id: "recess",
      title: "The Recess Rumble",
      badge: { icon: "🏃", name: "Work-First Wonder" },
      nodes: {
        start: {
          art: "🏫",
          caption: "Math time! Outside, kids are getting ready for recess.",
          speaker: "Teacher",
          cast: ["👩‍🏫"],
          bubble: "Finish your math page first. Then it's recess time!",
          feeling: "I want to go outside NOW! Math is boring!",
          heat: 7,
          choices: [
            { text: "Cross my arms and say, \"NO! I'm not doing it!\"",
              vision: "Hmm... the math page will still be there. Will recess wait?",
              result: { good: false, sfx: "TICK... TOCK...", art: "⏰",
                text: "Augi sits and refuses. Tick, tock. Recess starts... and ends. Now he still has to do the math page. He missed recess AND still did the work.",
                lesson: "Saying NO doesn't make the work go away. It only takes away the fun." } },
            { text: "Take a hero breath and zoom through my math!",
              vision: "If I start now, I might finish in time to play!",
              result: { good: true, sfx: "ZOOM!", art: "⚽",
                text: "Augi focuses like a laser. Problem 1... 2... 3... DONE! He runs outside and plays with his friends the WHOLE recess.",
                lesson: "Work first, play next = you get BOTH!" } },
            { text: "Ask, \"Can I do half now and half after recess?\"",
              vision: "Asking is a hero move. The teacher might have an idea.",
              go: "askHalf" }
          ]
        },
        askHalf: {
          art: "⏲️",
          caption: "The teacher smiles. Asking nicely was a smart move!",
          speaker: "Teacher",
          cast: ["👩‍🏫"],
          bubble: "Thanks for asking so nicely! The rule is work first. But I'll set a timer. Beat it, and you still get recess!",
          heat: 4,
          choices: [
            { text: "\"Okay! Let's beat that timer!\"",
              vision: "Racing the timer could be fun... and I'd get recess!",
              result: { good: true, sfx: "KA-POW!", art: "🏆",
                text: "Augi races the timer and WINS! He even has extra time on the swings.",
                lesson: "When a plan isn't what you wanted, a hero still finds a way to win." } },
            { text: "Grumble and go super s-l-o-w.",
              vision: "If I go slow... the timer might win.",
              result: { good: false, sfx: "FIZZLE...", art: "🐌",
                text: "Augi drags his pencil. The timer beeps. He only gets two minutes of recess, then the bell rings.",
                lesson: "Going slow on purpose only steals YOUR play time." } }
          ]
        }
      }
    },

    /* ---------------- MISSION 2: Starting work you don't want to do ---------------- */
    {
      id: "start",
      title: "The Start-Up Showdown",
      badge: { icon: "⚡", name: "Starter Spark" },
      nodes: {
        start: {
          art: "📝",
          caption: "Writing time. Augi does NOT feel like writing today.",
          speaker: "Teacher",
          cast: ["👨‍🏫"],
          bubble: "Time to start your writing, everybody.",
          feeling: "My face feels hot. RED ALERT! I don't want to!",
          heat: 9,
          choices: [
            { text: "Push my paper away and shout, \"NO!\"",
              vision: "Shouting might make everyone stare... and the writing is still there.",
              go: "shouted" },
            { text: "Use my words: \"I'm frustrated. Can I have one minute?\"",
              vision: "Telling how I feel might get me some help.",
              result: { good: true, sfx: "SHIELD UP!", art: "🛡️",
                text: "The teacher nods. \"Thanks for telling me.\" Augi takes one calm minute, then starts writing. It feels easier now!",
                lesson: "Saying how you feel is a SUPER power. Grown-ups can help when they know." } },
            { text: "Just write ONE sentence and see how it goes.",
              vision: "One sentence is small. Maybe I can do small.",
              result: { good: true, sfx: "BAM!", art: "✏️",
                text: "One sentence... then another... then another! Starting was the hardest part. Augi's story is about a flying pizza!",
                lesson: "Starting is the hardest part. Do one small piece, then the next." } }
          ]
        },
        shouted: {
          art: "😮",
          caption: "Uh-oh. The whole class is looking. The teacher stays calm.",
          speaker: "Teacher",
          cast: ["👨‍🏫"],
          bubble: "I can see you're upset. You can go to the calm corner, then come back and try.",
          heat: 8,
          choices: [
            { text: "Go to the calm corner, breathe, and come back.",
              vision: "A break could help my brain cool down.",
              result: { good: true, sfx: "COMEBACK!", art: "🌈",
                text: "Augi breathes in the calm corner. His face cools down. He comes back and starts writing. The teacher gives him a thumbs up!",
                lesson: "Even after a rough start, a hero can turn it around." } },
            { text: "Keep shouting, \"You can't make me!\"",
              vision: "Hmm... would shouting more make this better or worse?",
              result: { good: false, sfx: "UH-OH!", art: "🌧️",
                text: "Augi keeps shouting. He loses his free time today. And the writing paper is still waiting for him.",
                lesson: "Big angry words keep the problem around longer. Calm words help it end." } }
          ]
        }
      }
    },

    /* ---------------- MISSION 3: Someone cuts in line ---------------- */
    {
      id: "line",
      title: "The Line-Cutter Caper",
      badge: { icon: "🎯", name: "Fair-Play Flash" },
      nodes: {
        start: {
          art: "🛝",
          caption: "Augi waits and waits for the slide. Then Max cuts right in front!",
          speaker: "Max",
          cast: ["🧒"],
          bubble: "Me first!",
          feeling: "HEY! That's NOT fair! I'm so mad!",
          heat: 8,
          choices: [
            { text: "Yell \"CHEATER!\" and stomp off the playground.",
              vision: "If I stomp off... who gets my turn on the slide?",
              result: { good: false, sfx: "STOMP!", art: "😤",
                text: "Augi stomps away. Now he has no turn at all. He feels grumpy the rest of recess.",
                lesson: "Stomping off means YOU lose your fun. Stay and solve it!" } },
            { text: "Say in a strong, calm voice: \"Hey, I was here first.\"",
              vision: "A strong calm voice might work. Let's see what Max does.",
              go: "calmVoice" }
          ]
        },
        calmVoice: {
          art: "🛝",
          caption: "Max just shrugs.",
          speaker: "Max",
          cast: ["🧒"],
          bubble: "So?",
          heat: 6,
          choices: [
            { text: "Tell the recess helper what happened.",
              vision: "Recess helpers help keep things fair.",
              result: { good: true, sfx: "JUSTICE!", art: "🦸",
                text: "The recess helper reminds Max about taking turns. Max goes to the back. Augi zooms down the slide. WHEEE!",
                lesson: "Getting help from a grown-up is what smart heroes do." } },
            { text: "Shrug it off: \"Fine. Lots of time left!\" and keep my spot.",
              vision: "If I stay calm, I still get a turn really soon.",
              result: { good: true, sfx: "WHOOSH!", art: "😎",
                text: "Augi lets it go. One turn later, he's flying down the slide. Max even says, \"Sorry, you can go before me next time.\"",
                lesson: "Letting a small thing go keeps your day awesome." } },
            { text: "Grab the ladder and refuse to let Max climb.",
              vision: "Hmm... would that start a big argument?",
              result: { good: false, sfx: "SQUABBLE!", art: "⏸️",
                text: "Now there's a big argument. The recess helper closes the slide for a few minutes. Nobody gets to slide, not even Augi.",

/* ---------- helpers ---------- */
const scen = () => STORY.scenarios[state.i];
const node = () => scen().nodes[state.node];

function speak(text) {
  if (!('speechSynthesis' in window)) return toast('Read-aloud is not available here');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.92; u.pitch = 1.1;
  speechSynthesis.speak(u);
}
function stopSpeaking(){ if ('speechSynthesis' in window) speechSynthesis.cancel(); }
const sayBtn = () => ('speechSynthesis' in window)
  ? `<button class="btn white small say noprint" onclick="speak(sayText)" aria-label="Read this page out loud">🔊 Read to me</button>` : '';

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
function addPoints(n, why) { state.points += n; if (why) toast(`+${n} ⭐ ${why}`); }
function award(b) {
  if (state.badges.some(x => x.name === b.name)) return null;
  state.badges.push(b); return b;
}
function show(html) { stopSpeaking(); app.innerHTML = html; window.scrollTo({ top: 0 }); }

function topbar() {
  const dots = STORY.scenarios.map((_, k) =>
    `<span class="${k < state.i ? 'done' : k === state.i ? 'now' : ''}"></span>`).join('');
  return `<div class="topbar"><div class="mission">Mission ${state.i + 1} of ${STORY.scenarios.length}: ${esc(scen().title)}</div>
    <div class="row" style="gap:10px"><div class="progress" aria-hidden="true">${dots}</div><div class="pts">⭐ ${state.points}</div></div></div>`;
}

/* ---------- screens ---------- */
function titleScreen() {

}

function powersScreen() {

  show(`
  <section class="panel halftone" style="background-color:#d9f2ff">
    ${sayBtn()}
    <h2 class="center">Your Hero Powers!</h2>

      <div class="step"><div class="ic">🛑</div><h3>1. STOP</h3><p>Raise your Calm-Down Shield.</p></div>

      <div class="step"><div class="ic">🔮</div><h3>3. THINK</h3><p>Use Think-Ahead Vision. What will happen?</p></div>

      <button class="btn green" onclick="startScenario(0)">LET'S GO! ➜</button>
    </div>
  </section>`);
}

function startScenario(i) {
  Object.assign(state, { i, node: 'start', calm: false, vision: false, breathPaid: false, visionPaid: false, firstTry: true, rewound: false });
  nodeScreen();
}

function nodeScreen() {
  const s = scen(), n = node();
  const heat = state.calm ? Math.max(1, Math.round((n.heat ?? 5) / 3)) : (n.heat ?? 5);
  const mood = state.calm ? 'calm' : (heat >= 6 ? 'mad' : 'calm');
  const cast = (n.cast || []).map(c => `<span>${c}</span>`).join('');
  const letters = 'ABC';
  sayText = [n.caption, n.speaker && n.bubble ? `${n.speaker} says: ${n.bubble}` : n.bubble,
    n.feeling ? `${H.shortName} feels: ${n.feeling}` : '',
    'What will ' + H.name + ' do?',
    ...n.choices.map((c, k) => `${letters[k]}: ${c.text}` + (state.vision ? `. Vision: ${c.vision}` : ''))].filter(Boolean).join('. ');

  const feeling = n.feeling ? `
    <section class="panel">
      <div class="thought">💭 ${esc(H.shortName)} feels: “${esc(state.calm ? 'Okay... I feel calmer now. I can think!' : n.feeling)}”</div>
      <div class="meter" aria-label="Feeling meter">
        <div class="bar"><div class="needle" id="needle" style="left:${heat * 10}%"></div></div>
        <div class="labels"><span>😌 CALM</span><span>😐 HMM</span><span>😡 SEEING RED</span></div>
      </div>
    </section>` : '';

  const powers = `
    <section class="panel powers noprint">
      <h3 class="center">⚡ Power-Up Time! ⚡</h3>
      <div class="row" style="margin-top:10px">
        <button class="btn blue" onclick="breathe()" ${state.calm ? 'disabled' : ''}>🛡️ ${state.calm ? 'Shield Charged!' : 'Take 3 Hero Breaths'}</button>
        <button class="btn" style="background:#c9a7ff" onclick="toggleVision()">🔮 ${state.vision ? 'Vision ON' : 'Think-Ahead Vision'}</button>
      </div>
      <p class="center note">Heroes power up before they choose! (+⭐)</p>
    </section>`;

  show(`
  ${topbar()}
  <section class="panel halftone ${mood === 'mad' ? 'mad' : ''}" style="background-color:#ffe3ec">
    ${sayBtn()}
    <div class="caption">${esc(n.caption)}</div>
    <div class="scene">
      ${heroSVG(mood)}
      <div>
        ${n.bubble ? `${n.speaker ? `<div class="speaker">${esc(n.speaker)}:</div>` : ''}<div class="bubble">${esc(n.bubble)}</div>` : ''}
        <div class="cast"><span class="art">${n.art || ''}</span>${cast}</div>
      </div>
    </div>
  </section>
  ${feeling}
  ${powers}
  <section class="panel ${state.vision ? 'show-vision' : ''}">
    <h3>What will ${esc(H.name)} do?</h3>
    <div class="choices">
      ${n.choices.map((c, k) => `
        <button class="choice" onclick="choose(${k})">
          <span class="letter">${letters[k]}</span>
          <span><span>${esc(c.text)}</span><span class="vision">🔮 ${esc(c.vision || '')}</span></span>
        </button>`).join('')}
    </div>
  </section>`);
}

function breathe() {
  let count = 0, phase = 0;
  overlay.innerHTML = `<div class="breath-box">
      <div class="breath-msg" id="bmsg">Get ready...</div>
      <div class="breath-circle" id="bcircle">🛡️</div>
      <div class="breath-count" id="bcount">Hero Breath 0 of 3</div>
      <button class="btn white small" style="margin-top:16px" onclick="endBreathe(false)">I'm done</button>
    </div>`;
  overlay.classList.add('on');
  speak('Shield up. Let\'s take three hero breaths.');
  const c = document.getElementById('bcircle'), m = document.getElementById('bmsg'), k = document.getElementById('bcount');
  const step = () => {
    if (!overlay.classList.contains('on')) return;
    if (phase % 2 === 0) {
      count++;
      if (count > 3) return endBreathe(true);
      c.classList.add('big'); c.textContent = 'IN... 2... 3'; m.textContent = 'Breathe IN...';
      k.textContent = `Hero Breath ${count} of 3`;
    } else {
      c.classList.remove('big'); c.textContent = 'OUT... 2... 3'; m.textContent = 'Breathe OUT...';
    }
    phase++;
    window._breathTimer = setTimeout(step, 3200);
  };
  window._breathTimer = setTimeout(step, 1200);
}
function endBreathe(complete) {
  clearTimeout(window._breathTimer);
  overlay.classList.remove('on'); overlay.innerHTML = '';
  state.calm = true;
  if (!state.breathPaid) {
    state.breathPaid = true; state.breathUses++;
    addPoints(STORY.points.breath, complete ? 'Shield charged!' : 'Nice pause!');
    if (state.breathUses === 3) { const b = award(STORY.powerBadges.breath); if (b) setTimeout(() => toast(`🏅 New badge: ${b.name}!`), 2300); }
  }
  nodeScreen();
}
function toggleVision() {
  state.vision = !state.vision;
  if (state.vision && !state.visionPaid) {
    state.visionPaid = true; state.visionUses++;
    addPoints(STORY.points.vision, 'Thinking ahead!');
    if (state.visionUses === 3) { const b = award(STORY.powerBadges.vision); if (b) setTimeout(() => toast(`🏅 New badge: ${b.name}!`), 2300); }
  }
  nodeScreen();
}

function choose(k) {
  const c = node().choices[k];
  if (c.go) { state.node = c.go; state.calm = false; return nodeScreen(); }
  resultScreen(c.result);
}

function resultScreen(r) {
  const newBadges = [];
  let earned = 0;
  if (r.good) {
    earned = STORY.points.good + (state.firstTry ? STORY.points.firstTryBonus : 0);
    state.points += earned;
    const b = award(scen().badge); if (b) newBadges.push(b);
    if (state.rewound) { const cb = award(STORY.powerBadges.comeback); if (cb) newBadges.push(cb); }
  } else {
    state.firstTry = false;
  }
  const last = state.i === STORY.scenarios.length - 1;
  sayText = `${r.sfx} ${r.text} Hero lesson: ${r.lesson}` + (r.good ? ` You earned ${earned} hero points!` : ' Want to rewind time and try again?');
  show(`
  ${topbar()}
  <section class="panel halftone center" style="background-color:${r.good ? '#fff3b0' : '#dbe7ff'}">
    ${sayBtn()}
    <div class="burst ${r.good ? 'good' : 'oops'}">${esc(r.sfx)}</div>
    <div class="row" style="justify-content:center;align-items:flex-end;margin-top:6px">
      ${heroSVG(r.good ? 'happy' : 'oops')}
      <span style="font-size:clamp(3.5rem,12vw,6rem)">${r.art || ''}</span>
    </div>
  </section>
  <section class="panel">
    <p>${esc(r.text)}</p>
    <div class="lesson"><b>🦸 HERO LESSON:</b><p style="margin:4px 0 0">${esc(r.lesson)}</p></div>
    ${r.good
      ? `<div class="earned center">+${earned} ⭐ Hero Points${state.firstTry ? ' (First-try bonus!)' : ''}</div>
         <div class="center">${newBadges.map(b => `<div class="badge-pop"><span class="ic">${b.icon}</span><span class="comic" style="font-size:1.4rem">New badge: ${esc(b.name)}!</span></div>`).join('<br>')}</div>`
      : `<p class="center" style="margin-top:12px"><b>That's okay! Even superheroes get a do-over.</b></p>`}
    <div class="row noprint" style="justify-content:center;margin-top:16px">
      ${r.good
        ? `<button class="btn green" onclick="${last ? 'endScreen()' : `startScenario(${state.i + 1})`}">${last ? '🏆 GET MY CERTIFICATE!' : 'NEXT MISSION ➜'}</button>`
        : `<button class="btn red" onclick="rewind()">⏪ REWIND TIME & TRY AGAIN</button>`}
    </div>
  </section>`);
}

function rewind() {
  overlay.innerHTML = '<div class="rewind">⏪ REWIND!</div>';
  overlay.classList.add('on');
  setTimeout(() => {
    overlay.classList.remove('on'); overlay.innerHTML = '';
    Object.assign(state, { node: 'start', calm: false, vision: false, rewound: true });
    nodeScreen();
  }, 1000);
}

function endScreen() {
  const all = [...STORY.scenarios.map(s => s.badge), ...Object.values(STORY.powerBadges)];
  const has = b => state.badges.some(x => x.name === b.name);
  const date = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  sayText = `${STORY.certificate.title}. ${H.name} ${STORY.certificate.line} Total hero points: ${state.points}. Badges earned: ${state.badges.map(b => b.name).join(', ')}. Great job, hero!`;
  show(`
  <section class="panel cert">
    ${sayBtn()}
    <h2>🏆 ${esc(STORY.certificate.title)} 🏆</h2>
    <p>This certifies that</p>
    <div class="name">${esc(H.name)}</div>
    <p><b>${esc(STORY.certificate.line)}</b></p>
    <div class="row" style="justify-content:center">${heroSVG('happy')}<div class="burst good">${state.points} ⭐</div></div>
    <h3 style="margin-top:10px">Badges Earned: ${state.badges.length} of ${all.length}</h3>
    <div class="badges">
      ${all.map(b => `<div class="bdg ${has(b) ? '' : 'locked'}"><div class="ic">${b.icon}</div><div class="nm">${esc(b.name)}</div></div>`).join('')}
    </div>
    <p>Awarded on ${esc(date)}</p>
    <div class="row noprint" style="justify-content:center;margin-top:12px">
      <button class="btn" onclick="window.print()">🖨️ Print It!</button>
      <button class="btn red" onclick="playAgain()">↺ Play Again</button>
    </div>
  </section>`);
}

function playAgain() {
  Object.assign(state, { points: 0, badges: [], breathUses: 0, visionUses: 0 });
  titleScreen();
}

titleScreen();
</script>
</body>
</html>
